server:
  port: 8081

spring:
  application:
    name: cibseven-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/bikeleasing_engine
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    deployment-resource-pattern: []
    webapp:
      application-path: /camunda
    database:
      type: postgres
      schema-update: true
    # Poll async-continuation jobs quickly so the process advances promptly between wait states.
    job-execution:
      wait-time-in-millis: 250
      max-wait: 1000

