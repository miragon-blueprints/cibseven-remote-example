server:
  port: 8081

spring:
  application:
    name: cibseven-engine
  datasource:
    url: jdbc:postgresql://localhost:5432/bikeleasing_engine
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  # The engine host has no JPA entities of its own — the CIB seven engine manages its own schema (see
  # `camunda.bpm.database` below). JPA is only present to provide the shared DataSource.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin
    # Deploy BPMN, DMN and Camunda Forms from the classpath — `classpath*:` also scans the
    # `common-package` jar, which owns the process contract.
    deployment-resource-pattern:
      - classpath*:**/*.bpmn
      - classpath*:**/*.dmn
      - classpath*:**/*.form
    webapp:
      application-path: /camunda
    database:
      type: postgres
      schema-update: true
    # Poll async-continuation jobs quickly so the process advances promptly between wait states.
    job-execution:
      wait-time-in-millis: 250
      max-wait: 1000

