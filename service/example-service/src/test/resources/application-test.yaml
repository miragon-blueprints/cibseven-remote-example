spring:
  # This service no longer embeds the engine — only its own domain persistence is exercised in tests
  # (slice tests: @WebMvcTest / @DataJpaTest). The engine is remote and mocked in adapter tests.
  datasource:
    url: jdbc:h2:mem:bikeleasing-test;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
