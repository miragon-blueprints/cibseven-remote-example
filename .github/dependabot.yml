version: 2

multi-ecosystem-groups:
  backend:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:

  # Backend dependencies and the Postgres image in the dev stack, grouped into one PR
  # variant:kotlin-gradle
  - package-ecosystem: "gradle"
    directory: "/kotlin-gradle"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"
  # /variant:kotlin-gradle

  # variant:java-maven
  - package-ecosystem: "maven"
    directory: "/java-maven"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"
  # /variant:java-maven

  - package-ecosystem: "docker-compose"
    directory: "/stack"
    patterns:
      - "*"
    multi-ecosystem-group: "backend"

  # Dev tooling (bpmnlint and its local plugin) — package.json lives at the repo root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      tooling-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      tooling-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
          - "major"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
