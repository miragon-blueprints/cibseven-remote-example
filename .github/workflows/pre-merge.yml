name: Pre-Merge Checks

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Lint BPMN (bpmnlint)
        run: |
          npm --prefix tools ci
          npm --prefix tools run lint:bpmn

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle build
        run: ./gradlew build --no-daemon

  bruno:
    name: Bruno end-to-end scenarios
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bikeleasing_engine
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d bikeleasing_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create the worker's domain database
        run: PGPASSWORD=admin psql -h localhost -U admin -d bikeleasing_engine -c 'CREATE DATABASE bikeleasing_app;'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the engine host (engine-service)
        run: ./gradlew :service:engine-service:bootRun --no-daemon > engine.log 2>&1 &

      - name: Wait for the engine to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081/engine-rest/engine > /dev/null; then
              echo "Engine is up"; exit 0
            fi
            sleep 3
          done
          echo "Engine did not start in time"; tail -n 200 engine.log; exit 1

      - name: Start the worker (example-service)
        run: ./gradlew :service:example-service:bootRun --no-daemon > worker.log 2>&1 &

      - name: Wait for the worker to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/api/bike-leasing/00000000-0000-0000-0000-000000000000 || true)
            if [ "$code" != "000" ]; then
              echo "Worker is up (HTTP $code)"; exit 0
            fi
            sleep 3
          done
          echo "Worker did not start in time"; tail -n 200 worker.log; exit 1

      - name: Run Bruno scenarios
        working-directory: bruno
        run: npx --yes @usebruno/cli run . --env local -r

      - name: Dump application logs on failure
        if: failure()
        run: |
          echo "===== engine.log ====="; tail -n 300 engine.log
          echo "===== worker.log ====="; tail -n 300 worker.log
