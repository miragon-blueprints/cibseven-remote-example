name: Nightly Checks · Kotlin/Gradle

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation:
    name: Full mutation testing (PIT, gate 80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Run PIT mutation testing
        working-directory: kotlin-gradle
        run: ./gradlew :service:example-service:pitest --no-daemon

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pitest-report-kotlin-gradle
          path: kotlin-gradle/service/example-service/build/reports/pitest
          if-no-files-found: warn
